<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G検定 単語帳</title>
<link rel="manifest" href="manifest.json">
<style>
  body {
    font-family: sans-serif;
    text-align: center;
    background-color: #f5f5f5;
    padding: 20px;
  }
  #card {
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    padding: 30px;
    width: 85%;
    margin: 0 auto;
    font-size: 20px;
    min-height: 150px;
  }
  button {
    margin: 15px 5px;
    padding: 12px 20px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    background-color: #4a90e2;
    color: white;
    cursor: pointer;
  }
</style>
</head>
<body>

<h1>G検定 単語帳</h1>

<div id="card">
  <p id="term">ここに用語が表示されます</p>
</div>

<div>
  <button onclick="showAnswer()">答えを見る</button>
  <button onclick="nextCard()">次の問題</button>
</div>

<script>
const words = [
{ term: "人工知能", meaning: "人間の知能を計算機上で実現する技術や研究分野" },
{ term: "機械学習", meaning: "データから規則やパターンを自動的に学習する技術" },
{ term: "ディープラーニング", meaning: "多層のニューラルネットワークを用いた機械学習手法" },
{ term: "教師あり学習", meaning: "正解ラベル付きのデータを用いてモデルを学習させる手法" },
{ term: "教師なし学習", meaning: "正解ラベルのないデータから構造やパターンを見つける学習手法" },
{ term: "強化学習", meaning: "行動の結果得られる報酬を最大化するように学習する手法" },
{ term: "半教師学習", meaning: "少量のラベル付きデータと大量のラベルなしデータを組み合わせて学習する手法" },
{ term: "ニューラルネットワーク", meaning: "人間の脳神経を模した情報処理モデル" },
{ term: "パーセプトロン", meaning: "単純な二値分類を行う初期のニューラルネットワークモデル" },
{ term: "誤差逆伝播法(バックプロパゲーション)", meaning: "出力誤差を逆方向に伝えて重みを更新する学習アルゴリズム" },
{ term: "過学習(オーバーフィッティング)", meaning: "訓練データに過度に適合し、未知データへの汎化性能が低くなる現象" },
{ term: "転移学習", meaning: "あるタスクで学習したモデルを別のタスクに応用する手法" },
{ term: "畳み込みニューラルネットワーク(CNN)", meaning: "画像認識などで用いられる、畳み込み層を持つニューラルネットワーク" },
{ term: "再帰型ニューラルネットワーク(RNN)", meaning: "時系列データなど、順序を持つデータの処理に適したニューラルネットワーク" },
{ term: "LSTM", meaning: "長期的な依存関係を学習できるように改良されたRNNの一種" },
{ term: "勾配消失問題", meaning: "層が深くなるほど誤差の勾配が小さくなり学習が進まなくなる問題" },
{ term: "勾配爆発問題", meaning: "誤差の勾配が層を伝わるうちに急激に増大し学習が不安定になる問題" },
{ term: "活性化関数", meaning: "ニューラルネットワークの出力に非線形性を与える関数" },
{ term: "シグモイド関数", meaning: "出力を0から1の範囲に変換する活性化関数" },
{ term: "ReLU関数", meaning: "入力が0以下なら0、それ以外は入力をそのまま出力する活性化関数" },
{ term: "ソフトマックス関数", meaning: "複数の出力を確率分布に変換する、多クラス分類に用いる関数" },
{ term: "損失関数", meaning: "モデルの予測値と正解値の誤差を数値化する関数" },
{ term: "勾配降下法", meaning: "損失関数の勾配を用いてパラメータを最適化するアルゴリズム" },
{ term: "確率的勾配降下法(SGD)", meaning: "データの一部をランダムに用いて勾配降下法を行う手法" },
{ term: "バッチ正規化", meaning: "各層の入力を正規化し、学習を安定化・高速化させる手法" },
{ term: "ドロップアウト", meaning: "学習時にランダムにニューロンを無効化し、過学習を防ぐ手法" },
{ term: "オートエンコーダ", meaning: "入力データを圧縮し復元することで特徴表現を学習するニューラルネットワーク" },
{ term: "敵対的生成ネットワーク(GAN)", meaning: "生成器と識別器が競い合いながら学習し、リアルなデータを生成する手法" },
{ term: "Transformer", meaning: "注意機構を中心に構成された、自然言語処理などで用いられるモデル構造" },
{ term: "Attention機構", meaning: "入力の重要な部分に重みをつけて処理するニューラルネットワークの仕組み" },
{ term: "BERT", meaning: "文脈を双方向から学習する事前学習済み自然言語処理モデル" },
{ term: "GPT", meaning: "文章生成に強みを持つ、Transformerを用いた大規模言語モデル" },
{ term: "自然言語処理(NLP)", meaning: "人間が使う言語をコンピュータで処理・理解する技術分野" },
{ term: "形態素解析", meaning: "文章を単語などの最小単位に分割し、品詞などを解析する処理" },
{ term: "word2vec", meaning: "単語を数値ベクトルとして表現する自然言語処理の手法" },
{ term: "強化学習(Q学習)", meaning: "行動価値関数を用いて最適な行動方針を学習する強化学習の手法" },
{ term: "アンサンブル学習", meaning: "複数のモデルを組み合わせて予測精度を上げる手法" },
{ term: "ランダムフォレスト", meaning: "複数の決定木を組み合わせて予測するアンサンブル学習の手法" },
{ term: "決定木", meaning: "条件分岐によってデータを分類・回帰するモデル" },
{ term: "サポートベクターマシン(SVM)", meaning: "データを分類する境界(マージン)を最大化する分類手法" },
{ term: "k近傍法(k-NN)", meaning: "近くにあるデータの多数決によって分類を行う手法" },
{ term: "クラスタリング", meaning: "データを類似性に基づいてグループ分けする教師なし学習の手法" },
{ term: "主成分分析(PCA)", meaning: "データの次元を削減し、重要な情報を保持したまま圧縮する手法" },
{ term: "特徴量エンジニアリング", meaning: "モデルの精度向上のため、データから有効な特徴量を作成・選択する作業" },
{ term: "交差検証(クロスバリデーション)", meaning: "データを複数に分割し、モデルの汎化性能を評価する手法" },
{ term: "混同行列", meaning: "分類モデルの予測結果と実際の値の関係を表にまとめたもの" },
{ term: "適合率(Precision)", meaning: "正と予測したデータのうち、実際に正しかった割合" },
{ term: "再現率(Recall)", meaning: "実際に正であるデータのうち、正しく予測できた割合" },
{ term: "F1スコア", meaning: "適合率と再現率の調和平均で表される評価指標" },
{ term: "シンギュラリティ(技術的特異点)", meaning: "人工知能が人間の知能を超える転換点とされる仮説的な時点" },
{ term: "トロッコ問題", meaning: "AIの倫理的判断を考える際に用いられる、犠牲の選択を問う思考実験" },
{ term: "explainable AI(XAI)", meaning: "AIの判断根拠を人間が理解できるように説明する技術・研究分野" },
];

let currentIndex = 0;

function pickRandom() {
  currentIndex = Math.floor(Math.random() * words.length);
  document.getElementById("term").innerText = words[currentIndex].term;
}

function showAnswer() {
  document.getElementById("term").innerText = words[currentIndex].meaning;
}

function nextCard() {
  pickRandom();
}

pickRandom();

// PWA化のためのおまじない(Service Workerの登録)
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
